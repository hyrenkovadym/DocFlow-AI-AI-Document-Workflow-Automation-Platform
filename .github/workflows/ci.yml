name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: docflow
          POSTGRES_PASSWORD: docflow
          POSTGRES_DB: docflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docflow" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run backend lint
        run: |
          cd apps/api
          ruff check .

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql+psycopg2://docflow:docflow@localhost:5432/docflow
          REDIS_URL: redis://localhost:6379/0
          AI_PROVIDER: mock
          SECRET_KEY: test-secret
        run: |
          cd apps/api
          pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: |
          cd apps/web
          npm install

      - name: Frontend lint
        run: |
          cd apps/web
          npm run lint

      - name: Frontend typecheck
        run: |
          cd apps/web
          npm run typecheck

      - name: Frontend build
        run: |
          cd apps/web
          npm run build
